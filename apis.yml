aid: tsenta
name: Tsenta
description: >-
  Tsenta is a Y Combinator-backed (S26) AI job-application agent that watches
  50,000+ company career pages, tailors a resume and cover letter per role from
  the actual job description, and submits applications across 19 applicant
  tracking systems (Workday, Greenhouse, Lever, Ashby, Rippling, iCIMS,
  BambooHR, Workable, JazzHR, Jobvite, BreezyHR, Oracle Cloud, SmartRecruiters,
  Paylocity, UltiPro, ADP, Dover, Gem, Zoho Recruit). Every change is shown to
  the user before it goes out ("Review Before Submit"), or it can run headless.
  Tsenta is available on web, native iOS and Android apps, desktop, iMessage,
  WhatsApp, a Chrome extension, and as a hosted Model Context Protocol (MCP)
  server / CLI at api.autojobs.me for Claude, Cursor, Codex and any tool-using
  AI agent, authorized over OAuth 2.0 with PKCE and dynamic client registration.
